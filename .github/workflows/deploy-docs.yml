name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package.json

      - name: Install dependencies
        run: npm install
        working-directory: docs

      - name: Build VitePress
        run: npm run build
        working-directory: docs

      # Checkout gh-pages, copy built files into /docs/ subdirectory,
      # then commit — leaving the marketing site files (index.html etc.) untouched.
      - name: Deploy to gh-pages /docs/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          destination_dir: docs
          keep_files: true
          commit_message: "docs: deploy VitePress build [skip ci]"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
