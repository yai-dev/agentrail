<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <marker id="arr" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <path d="M0,0.5 L0,4.5 L4.5,2.5 Z" fill="#c4ff2e"/>
    </marker>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4ff2e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c4ff2e"/>
    </linearGradient>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');
      .wm { font-family: 'DM Mono', 'Courier New', monospace; }
    ]]></style>
  </defs>

  <!-- trail: left to middle -->
  <line x1="14" y1="27" x2="24" y2="20.5" stroke="url(#tg)" stroke-width="1.6" marker-end="url(#arr)" stroke-linecap="round"/>
  <!-- trail: middle to right -->
  <line x1="27" y1="20.5" x2="35.5" y2="25" stroke="#c4ff2e" stroke-width="1.6" marker-end="url(#arr)" stroke-linecap="round"/>

  <!-- left node: solid (origin agent) -->
  <circle cx="11" cy="28" r="5.5" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="11" cy="28" r="2.2" fill="#c4ff2e"/>

  <!-- middle node: dimmed (orchestration layer) -->
  <circle cx="25.5" cy="18.5" r="5.5" fill="none" stroke="#3a3a3a" stroke-width="1"/>
  <circle cx="25.5" cy="18.5" r="2" fill="#888880" fill-opacity="0.6"/>

  <!-- right node: accent outline (output agent) -->
  <circle cx="38" cy="26" r="5.5" fill="none" stroke="#c4ff2e" stroke-width="1.5"/>
  <circle cx="38" cy="26" r="2" fill="#c4ff2e" fill-opacity="0.4"/>

  <!-- motion dots -->
  <circle cx="18.8" cy="24" r="1" fill="#c4ff2e" fill-opacity="0.45"/>
  <circle cx="31.2" cy="22.5" r="0.7" fill="#c4ff2e" fill-opacity="0.3"/>

  <!-- wordmark: "agent" bold light -->
  <text x="54" y="31" class="wm" font-size="20" font-weight="500" fill="#eceae3" letter-spacing="-0.3">agent</text>
  <!-- wordmark: "rail" regular, neon accent -->
  <text x="131" y="31" class="wm" font-size="20" font-weight="400" fill="#c4ff2e" letter-spacing="-0.3">rail</text>
</svg>
