<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604"
     role="img" aria-label="Agentrail Architecture Diagram">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="4" refY="6" orient="auto">
      <path d="M1,1 L4,6 L7,1" fill="none" stroke="#4a4a48"
            stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- background panel -->
  <rect width="900" height="604" fill="#0d0d0b" rx="4"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- LAYER 4  Your App  (dashed, user code)      -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="20" y="20" width="860" height="72"
        fill="none" stroke="#363634" stroke-width="1" stroke-dasharray="5 4" rx="2"/>

  <rect x="40" y="36" width="22" height="22" rx="2" fill="#1e1e1c"/>
  <text x="51" y="47" text-anchor="middle" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="11" fill="#555550">4</text>

  <text x="73" y="47" dominant-baseline="middle"
        font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#6a6864">Your App</text>

  <text x="73" y="70" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12"
        fill="#3e3e3c" letter-spacing="0.02em">Profiles  &#183;  Routes  &#183;  UI  &#183;  Business Logic</text>

  <!-- arrow -->
  <line x1="450" y1="100" x2="450" y2="120"
        stroke="#444442" stroke-width="1" marker-end="url(#ah)"/>
  <text x="459" y="110" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#444442" letter-spacing="0.1em">DEPENDS ON</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- LAYER 3  @agentrail/app  (highlighted)      -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="20" y="128" width="860" height="100"
        fill="rgba(196,255,46,0.05)" stroke="rgba(196,255,46,0.38)" stroke-width="1" rx="2"/>

  <rect x="40" y="144" width="22" height="22" rx="2" fill="#c4ff2e"/>
  <text x="51" y="155" text-anchor="middle" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="11" fill="#060606" font-weight="bold">3</text>

  <text x="73" y="155" dominant-baseline="middle"
        font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#c4ff2e">@agentrail/app</text>

  <text x="73" y="179" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12"
        fill="rgba(196,255,46,0.55)" letter-spacing="0.01em">createAgentApp  &#183;  defineProfile  &#183;  SessionManager  &#183;  Plugins  &#183;  Slash Commands  &#183;  Config</text>

  <text x="73" y="203" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="11"
        fill="rgba(196,255,46,0.28)" letter-spacing="0.01em">createChatRoute  &#183;  createStreamRoute  &#183;  createOrchestrationRegistry  &#183;  compat migration helpers</text>

  <!-- arrow -->
  <line x1="450" y1="236" x2="450" y2="256"
        stroke="#444442" stroke-width="1" marker-end="url(#ah)"/>
  <text x="459" y="246" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#444442" letter-spacing="0.1em">DEPENDS ON</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- LAYER 2  @agentrail/capabilities            -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="20" y="264" width="860" height="192"
        fill="#101010" stroke="#2a2a28" stroke-width="1" rx="2"/>

  <rect x="40" y="280" width="22" height="22" rx="2" fill="#242422"/>
  <text x="51" y="291" text-anchor="middle" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="11" fill="#666660">2</text>

  <text x="73" y="291" dominant-baseline="middle"
        font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#c8c6c0">@agentrail/capabilities</text>

  <!-- includes divider -->
  <text x="40" y="314" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#484844" letter-spacing="0.16em">INCLUDES &#8594;</text>
  <line x1="40" y1="324" x2="860" y2="324" stroke="#222220" stroke-width="1"/>

  <!-- left col x=54, right col x=484 -->
  <text x="54" y="344" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12.5" fill="rgba(196,255,46,0.7)">filesystem</text>
  <text x="484" y="344" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12.5" fill="rgba(196,255,46,0.7)">browser</text>

  <text x="54" y="368" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12.5" fill="rgba(196,255,46,0.7)">knowledge</text>
  <text x="484" y="368" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12.5" fill="rgba(196,255,46,0.7)">skills</text>

  <text x="54" y="392" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12.5" fill="rgba(196,255,46,0.7)">orchestration</text>
  <text x="484" y="392" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12.5" fill="rgba(196,255,46,0.7)">tools</text>

  <text x="54" y="416" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12.5" fill="rgba(196,255,46,0.7)">sandbox</text>
  <text x="484" y="416" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12.5" fill="rgba(196,255,46,0.7)">memoryContext</text>

  <text x="54" y="440" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="10.5"
        fill="rgba(196,255,46,0.28)" letter-spacing="0.01em">via defineProfile&#40;&#123; capabilities: [filesystem&#40;&#123; sandboxManager &#125;&#41;, knowledge&#40;km&#41;, orchestration&#40;registry, factory&#41;, ...]  &#125;&#41;</text>

  <!-- arrow -->
  <line x1="450" y1="464" x2="450" y2="484"
        stroke="#444442" stroke-width="1" marker-end="url(#ah)"/>
  <text x="459" y="474" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#444442" letter-spacing="0.1em">DEPENDS ON</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- LAYER 1  @agentrail/core  (foundation)      -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="20" y="492" width="860" height="96"
        fill="rgba(196,255,46,0.08)" stroke="#c4ff2e" stroke-width="1" rx="2"/>

  <rect x="40" y="508" width="22" height="22" rx="2" fill="#c4ff2e"/>
  <text x="51" y="519" text-anchor="middle" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="11" fill="#060606" font-weight="bold">1</text>

  <rect x="732" y="508" width="128" height="22" rx="1" fill="#c4ff2e"/>
  <text x="796" y="519" text-anchor="middle" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#060606" letter-spacing="0.12em" font-weight="bold">FOUNDATION</text>

  <text x="73" y="519" dominant-baseline="middle"
        font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#c4ff2e">@agentrail/core</text>

  <text x="73" y="543" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="12"
        fill="rgba(196,255,46,0.5)" letter-spacing="0.01em">Agent Loop  &#183;  Tool Contract  &#183;  LLM Provider API  &#183;  Prompt SDK  &#183;  Session Types</text>

  <text x="73" y="566" dominant-baseline="middle"
        font-family="'Courier New',Courier,monospace" font-size="11.5"
        fill="rgba(196,255,46,0.28)" letter-spacing="0.01em">defineAgent  &#183;  defineTool  &#183;  definePromptBundle  &#183;  DefaultLlmClient  &#183;  Usage Tracking</text>
